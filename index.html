<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARC STORE | المتجر الرقمي المتكامل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #030305;
      --bg-card: rgba(12, 12, 18, 0.85);
      --accent-red: #ff003c;
      --accent-red-bright: #ff1e53;
      --accent-red-glow: rgba(255, 0, 60, 0.7);
      --text-main: #ffffff;
      --text-muted: #9595b2;
      --border-glow: rgba(255, 0, 60, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; position: relative; padding-bottom: 80px; }

    /* Atmosphere Glows */
    .bg-glow-1, .bg-glow-2 {
      position: fixed; width: 500px; height: 500px; border-radius: 50%; filter: blur(150px); z-index: -1; pointer-events: none;
      animation: pulseGlow 6s infinite alternate ease-in-out;
    }
    .bg-glow-1 { top: -120px; right: -120px; background: var(--accent-red); opacity: 0.35; }
    .bg-glow-2 { bottom: -120px; left: -120px; background: #6100ff; opacity: 0.25; }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      100% { transform: scale(1.35) translate(-40px, 40px); opacity: 0.5; }
    }

    /* Header & Bar */
    header {
      position: sticky; top: 0; z-index: 1000; background: rgba(3, 3, 5, 0.92); backdrop-filter: blur(25px);
      border-bottom: 2px solid var(--accent-red); padding: 16px 8%; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 5px 30px rgba(255, 0, 60, 0.25);
    }

    .logo {
      font-family: 'Orbitron', 'Cairo', sans-serif; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; color: #fff;
      display: flex; align-items: center; gap: 12px; text-shadow: 0 0 25px var(--accent-red-glow);
    }
    .logo span { color: var(--accent-red); text-shadow: 0 0 20px var(--accent-red); }

    /* Currency Box Styling */
    .currency-box {
      display: flex; align-items: center; gap: 8px; background: rgba(255, 0, 60, 0.15); border: 2px solid var(--accent-red);
      padding: 6px 14px; border-radius: 12px; box-shadow: 0 0 15px var(--accent-red-glow);
    }
    .currency-box label { font-weight: 800; font-size: 0.9rem; color: #fff; }
    .currency-picker {
      background: transparent; border: none; color: #fff; font-weight: 900; font-size: 1rem; outline: none; cursor: pointer;
    }
    .currency-picker option { background: #09090e; color: #fff; }

    /* Hero Banner */
    .hero { text-align: center; padding: 50px 20px 25px; position: relative; }
    .hero-title {
      font-size: 3.4rem; font-weight: 900; line-height: 1.15;
      background: linear-gradient(135deg, #ffffff 0%, #ff4d73 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px;
      text-shadow: 0 0 40px rgba(255, 0, 60, 0.3);
    }
    .hero-subtitle { color: var(--text-muted); font-size: 1.2rem; max-width: 680px; margin: 0 auto 30px; }

    /* Filters Bar */
    .filters-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 45px; padding: 0 20px; }
    .filter-btn {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 0, 60, 0.25); color: #fff; padding: 12px 28px;
      border-radius: 50px; font-weight: 800; font-size: 1rem; cursor: pointer; backdrop-filter: blur(10px);
      transition: all 0.35s ease; display: flex; align-items: center; gap: 10px;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-red); border-color: var(--accent-red-bright); box-shadow: 0 0 30px var(--accent-red-glow); transform: translateY(-3px);
    }

    /* Products Grid */
    .container { max-width: 1300px; margin: 0 auto; padding: 0 25px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 32px; }

    .card {
      background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 24px; overflow: hidden;
      backdrop-filter: blur(20px); transition: all 0.4s ease; display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .card:hover {
      transform: translateY(-10px) scale(1.02); border-color: var(--accent-red-bright);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 0, 60, 0.45);
    }

    .card-img-box { position: relative; width: 100%; height: 200px; overflow: hidden; }
    .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s ease; }
    .card:hover .card-img { transform: scale(1.08); }

    .card-badge {
      position: absolute; top: 12px; right: 12px; background: rgba(3, 3, 5, 0.85); color: var(--accent-red);
      border: 1px solid var(--accent-red); font-size: 0.8rem; padding: 4px 14px; border-radius: 20px; font-weight: 800;
    }

    .card-body { padding: 22px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .card-title { font-size: 1.35rem; font-weight: 900; margin-bottom: 10px; }
    .card-desc { color: var(--text-muted); font-size: 0.92rem; line-height: 1.6; margin-bottom: 20px; flex-grow: 1; }
    .card-price { font-size: 1.8rem; font-weight: 900; color: #fff; margin-bottom: 18px; text-shadow: 0 0 15px rgba(255,255,255,0.2); }

    .btn-buy {
      width: 100%; background: linear-gradient(135deg, var(--accent-red) 0%, #a80027 100%); color: #fff; border: none;
      padding: 15px; border-radius: 14px; font-weight: 900; font-size: 1.05rem; cursor: pointer; display: flex;
      justify-content: center; align-items: center; gap: 10px; box-shadow: 0 5px 25px var(--accent-red-glow); transition: all 0.3s ease;
    }
    .btn-buy:hover { box-shadow: 0 8px 35px var(--accent-red-glow); transform: translateY(-2px); }

    /* Modal */
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(20px); z-index: 2000;
      display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-box {
      background: #09090e; border: 2px solid var(--accent-red); width: 100%; max-width: 530px; border-radius: 28px;
      padding: 30px; box-shadow: 0 0 60px rgba(255, 0, 60, 0.45); animation: zoomIn 0.3s ease;
    }
    @keyframes zoomIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 800; font-size: 0.95rem; }
    .form-control {
      width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 0, 60, 0.3); color: #fff;
      padding: 14px; border-radius: 12px; outline: none; font-size: 1rem; font-weight: 600;
    }
    .form-control:focus { border-color: var(--accent-red); box-shadow: 0 0 20px var(--accent-red-glow); }

    .pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .pay-btn {
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 0, 60, 0.3); color: #fff; padding: 12px;
      border-radius: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;
    }
    .pay-btn.selected { border-color: var(--accent-red); background: rgba(255, 0, 60, 0.25); box-shadow: 0 0 20px var(--accent-red-glow); }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <header>
    <div class="logo"><i class="fa-solid fa-bolt"></i> ARC <span>STORE</span></div>
    
    <!-- Currency Selector Box -->
    <div class="currency-box">
      <i class="fa-solid fa-coins" style="color:var(--accent-red)"></i>
      <label for="currencySelect">العملة:</label>
      <select id="currencySelect" class="currency-picker" onchange="changeCurrency(this.value)">
        <option value="USD">USD ($)</option>
        <option value="AED">AED (درهم)</option>
        <option value="SAR">SAR (ريال)</option>
      </select>
    </div>
  </header>

  <section class="hero">
    <h1 class="hero-title">متجر ARC STORE الرقمي</h1>
    <p class="hero-subtitle">اشتراكات VIP، خدمات نمو الحسابات، وبطاقات التفعيل بأفضل الأداء والسرعة.</p>
  </section>

  <!-- Dynamic Filters Bar -->
  <div class="filters-container" id="filtersContainer"></div>

  <main class="container">
    <div class="products-grid" id="grid"></div>
  </main>

  <!-- Checkout Modal -->
  <div class="modal" id="checkoutModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
        <h3 id="modalTitle" style="font-size: 1.4rem; font-weight: 900;">تأكيد الطلب</h3>
        <i class="fa-solid fa-xmark" style="cursor:pointer; font-size: 1.5rem; color: var(--accent-red);" onclick="closeCheckout()"></i>
      </div>

      <form id="payForm" onsubmit="executeOrder(event)">
        <div class="form-group">
          <label id="qtyLabel">الكمية المطلوبة</label>
          <input type="number" id="orderQty" class="form-control" oninput="recalcPrice()">
          <small id="qtyNotice" style="color: var(--accent-red); font-size: 0.8rem; display: none; margin-top: 5px;">* الحد الأدنى لطلب النمو هو 250 عدداً</small>
        </div>

        <div class="form-group">
          <label>رابط الحساب / معرف المستخدم / الإيميل للتفعيل</label>
          <input type="text" id="targetUrl" class="form-control" placeholder="أدخل بيانات التفعيل هنا..." required>
        </div>

        <div class="form-group">
          <label>طريقة الدفع</label>
          <div class="pay-options">
            <div class="pay-btn selected" id="optCard" onclick="selectPay('card')"><i class="fa-solid fa-credit-card"></i> بطاقة ائتمان</div>
            <div class="pay-btn" id="optApple" onclick="selectPay('apple')"><i class="fa-brands fa-apple"></i> Apple Pay</div>
          </div>
        </div>

        <div style="background: rgba(255,0,60,0.15); border: 1px dashed var(--accent-red); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: 800;">المبلغ الإجمالي:</span>
          <span id="totalCost" style="font-size: 1.6rem; font-weight: 900; color: var(--accent-red);">0.00</span>
        </div>

        <button type="submit" class="btn-buy" style="background: #00c853; box-shadow: 0 5px 25px rgba(0, 200, 83, 0.4);">
          <i class="fa-brands fa-whatsapp"></i> تأكيد الطلب والدفع عبر الواتساب
        </button>
      </form>
    </div>
  </div>

  <script>
    const rates = { USD: 1, AED: 3.67, SAR: 3.75 };
    const symbols = { USD: '$', AED: 'AED', SAR: 'SAR' };
    let selectedCurrency = 'USD';

    // Default Categories
    const defaultCategories = [
      { id: 'subs', name: 'الاشتراكات', icon: 'fa-crown' },
      { id: 'cards', name: 'بطاقات وألعاب', icon: 'fa-gamepad' },
      { id: 'boost', name: 'دعم ونمو الحسابات', icon: 'fa-rocket' }
    ];

    const defaultProducts = [
      {
        id: '1', title: 'اشتراك نتفليكس VIP شهر', category: 'subs', priceUSD: 5.00, unitPrice: true,
        image: 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=600&q=80', desc: 'حساب Ultra HD 4K ملف شخصي برقم سري وخاص بك.'
      },
      {
        id: '2', title: 'اشتراك شاهد VIP الرياضية', category: 'subs', priceUSD: 8.50, unitPrice: true,
        image: 'https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=600&q=80', desc: 'شاهد الدوريات والمسلسلات بجودة عالية بدون إعلانات.'
      },
      {
        id: '3', title: 'متابعين تيك توك حقيقيين', category: 'boost', priceUSD: 3.50, unitPrice: false,
        image: 'https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=600&q=80', desc: 'تزويد سريع وثبات عالي للحساب (السعر لكل 1000 متابع - الحد الأدنى 250).'
      }
    ];

    let categories = JSON.parse(localStorage.getItem('arc_categories')) || defaultCategories;
    let products = JSON.parse(localStorage.getItem('arc_products')) || defaultProducts;
    let orders = JSON.parse(localStorage.getItem('arc_orders')) || [];
    let settings = JSON.parse(localStorage.getItem('arc_settings')) || { whatsapp: '971500000000' };

    let currentProd = null;
    let payMethod = 'card';
    let currentCategoryFilter = 'all';

    function changeCurrency(curr) {
      selectedCurrency = curr;
      renderCards(currentCategoryFilter);
    }

    function renderFilters() {
      const container = document.getElementById('filtersContainer');
      container.innerHTML = `
        <button class="filter-btn active" onclick="filterCat('all', this)">
          <i class="fa-solid fa-fire"></i> الكل
        </button>
      `;

      categories.forEach(cat => {
        const iconClass = cat.icon || 'fa-tag';
        container.innerHTML += `
          <button class="filter-btn" onclick="filterCat('${cat.id}', this)">
            <i class="fa-solid ${iconClass}"></i> ${cat.name}
          </button>
        `;
      });
    }

    function renderCards(filter = 'all') {
      currentCategoryFilter = filter;
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const list = filter === 'all' ? products : products.filter(p => p.category === filter);

      if(list.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">لا توجد منتجات متوفرة حالياً في هذا القسم.</p>`;
        return;
      }

      list.forEach(p => {
        const basePrice = p.priceUSD || p.price || 0;
        const convertedPrice = (basePrice * rates[selectedCurrency]).toFixed(2);
        const priceDisplay = p.unitPrice ? `${convertedPrice} ${symbols[selectedCurrency]}` : `${convertedPrice} ${symbols[selectedCurrency]} / 1000`;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-img-box">
            <img src="${p.image}" class="card-img" alt="${p.title}">
            <span class="card-badge">${getCatName(p.category)}</span>
          </div>
          <div class="card-body">
            <div>
              <h3 class="card-title">${p.title}</h3>
              <p class="card-desc">${p.desc || 'منتج رقمي متوفر للتسليم الفوري.'}</p>
            </div>
            <div>
              <div class="card-price">${priceDisplay}</div>
              <button class="btn-buy" onclick="openCheckout('${p.id}')"><i class="fa-solid fa-cart-shopping"></i> اطلب الآن</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function getCatName(catId) {
      const found = categories.find(c => c.id === catId);
      return found ? found.name : 'منتج رقمي';
    }

    function filterCat(cat, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards(cat);
    }

    function openCheckout(id) {
      currentProd = products.find(p => p.id === id);
      if(!currentProd) return;

      document.getElementById('modalTitle').innerText = currentProd.title;
      const qtyInput = document.getElementById('orderQty');
      const qtyNotice = document.getElementById('qtyNotice');

      if (currentProd.category === 'boost' || !currentProd.unitPrice) {
        qtyInput.value = 250;
        qtyInput.min = 250;
        qtyInput.step = 50;
        qtyNotice.style.display = 'block';
      } else {
        qtyInput.value = 1;
        qtyInput.min = 1;
        qtyInput.step = 1;
        qtyNotice.style.display = 'none';
      }

      recalcPrice();
      document.getElementById('checkoutModal').style.display = 'flex';
    }

    function closeCheckout() { document.getElementById('checkoutModal').style.display = 'none'; }

    function recalcPrice() {
      if(!currentProd) return;
      const qty = parseFloat(document.getElementById('orderQty').value) || 0;
      const basePrice = currentProd.priceUSD || currentProd.price || 0;
      let totalUSD = currentProd.unitPrice ? qty * basePrice : (qty / 1000) * basePrice;
      const totalConverted = (totalUSD * rates[selectedCurrency]).toFixed(2);
      document.getElementById('totalCost').innerText = `${totalConverted} ${symbols[selectedCurrency]}`;
    }

    function selectPay(type) {
      payMethod = type;
      document.getElementById('optCard').classList.toggle('selected', type === 'card');
      document.getElementById('optApple').classList.toggle('selected', type === 'apple');
    }

    function executeOrder(e) {
      e.preventDefault();
      const qty = parseFloat(document.getElementById('orderQty').value);

      if ((currentProd.category === 'boost' || !currentProd.unitPrice) && qty < 250) {
        alert('أقل كمية لخدمات النمو هي 250!');
        return;
      }

      const target = document.getElementById('targetUrl').value;
      const basePrice = currentProd.priceUSD || currentProd.price || 0;
      let totalUSD = currentProd.unitPrice ? qty * basePrice : (qty / 1000) * basePrice;
      const totalConverted = (totalUSD * rates[selectedCurrency]).toFixed(2) + ' ' + symbols[selectedCurrency];

      const newOrder = {
        id: 'ORD-' + Date.now(),
        productTitle: currentProd.title,
        quantity: qty,
        totalPrice: totalConverted,
        targetUrl: target,
        payMethod: payMethod === 'card' ? 'بطاقة ائتمانية' : 'Apple Pay',
        date: new Date().toLocaleString('ar-EG')
      };

      orders.unshift(newOrder);
      localStorage.setItem('arc_orders', JSON.stringify(orders));

      const msg = `*طلب جديد من متجر ARC STORE* ⚡\n\n` +
        `• *المنتج:* ${currentProd.title}\n` +
        `• *الكمية:* ${qty}\n` +
        `• *المبلغ الإجمالي:* ${totalConverted}\n` +
        `• *طريقة الدفع:* ${newOrder.payMethod}\n` +
        `• *بيانات التفعيل/الرابط:* ${target}\n\nيرجى تأكيد الطلب.`;

      closeCheckout();
      window.open(`https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    renderFilters();
    renderCards();
  </script>
</body>
</html>
